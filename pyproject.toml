[project]
name = "agent-interview-server"
version = "0.1.0"
description = "AI 应用服务端"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.0,<3.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
